[project]
name = "g1-wrist-camera-tools"
version = "0.1.0"
description = "URDF integration, collision geometry, and Viser visualization for Unitree G1 wrist cameras"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "PyYAML>=6",
    "yourdfpy>=0.0.58",
    "viser>=1.0",
    "trimesh>=4.12.2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/g1_wrist_camera"]

[tool.pytest.ini_options]
testpaths = ["tests"]
